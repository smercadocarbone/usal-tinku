# Stack completo de Tinku — dev local dockerizado:
#   db (Postgres 16 pgvector) + matching-service (Python) + backend (Spring Boot) + frontend (Next.js)
# Los schemas se crean/versionan via Flyway al levantar el backend (ver V1__crear_schemas.sql).
# Credenciales por defecto compatibles con backend/src/main/resources/application.yml.
# Nunca usar estos valores en ningun ambiente que no sea local.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tinku-postgres
    environment:
      POSTGRES_DB: tinku
      POSTGRES_USER: tinku_dev
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - tinku_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinku_dev -d tinku"]
      interval: 5s
      timeout: 5s
      retries: 5

  matching:
    build:
      context: ./matching-service
    container_name: tinku-matching
    environment:
      TINKU_PG_HOST: db
      TINKU_PG_PORT: 5432
      TINKU_PG_DBNAME: tinku
      TINKU_PG_USER: tinku_dev
      TINKU_PG_PASSWORD: changeme
      # AUD-015: token compartido con el backend. Vacio = fail-closed (503) en
      # /match y /recompute-embeddings. Mismo valor que MATCHING_SERVICE_TOKEN.
      TINKU_MATCHING_TOKEN: ${TINKU_MATCHING_TOKEN:-}
    ports:
      # AUD-015: solo el host, no la red del compose (el backend lo alcanza por
      # http://matching:8000). Sin esto quedaba publico en la LAN.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: tinku-backend
    environment:
      # Stack local: `dev` explícito. La imagen sola arranca en `prod` (AUD-004).
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tinku
      SPRING_DATASOURCE_USERNAME: tinku_dev
      SPRING_DATASOURCE_PASSWORD: changeme
      MATCHING_SERVICE_URL: http://matching:8000
      MATCHING_SERVICE_TOKEN: ${MATCHING_SERVICE_TOKEN:-}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DB_USER: tinku_dev
      DB_PASSWORD: changeme
      JWT_SECRET: ${JWT_SECRET:-CAMBIAR_EN_TODOS_LOS_AMBIENTES_AL_AGREGAR_UN_SECRET_REAL}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      RESERVAS_TARIFA_STUB: ${RESERVAS_TARIFA_STUB:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      matching:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: tinku-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  tinku_pgdata: