spring:
  application:
    name: tinku-backend

  # Perfil por defecto para el arranque local: `dev`. Sin esto, `./mvnw
  # spring-boot:run` no levanta porque StubOcrService (OCR falso para
  # dev/test) esta gated a los perfiles dev/test y no habria ningun OcrService.
  # Para otro ambiente se sobreescribe con SPRING_PROFILES_ACTIVE (ver
  # backend/README.md). El perfil `dev` usa la BDs local (localhost + creds
  # de docker-compose.yml) y el JWT secret de desarrollo — NUNCA ese set en prod.
  profiles:
    active: dev

  datasource:
    # Un solo motor PostgreSQL, schemas separados por modulo (Constitucion, Articulo VIII).
    # Reemplazar por variables de entorno reales antes de cualquier despliegue.
    url: jdbc:postgresql://localhost:5432/tinku
    username: ${DB_USER:tinku_dev}
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: validate # el esquema real lo maneja Flyway, nunca auto-generado en runtime
    open-in-view: false
    properties:
      hibernate:
        default_schema: identidad # override por @Table(schema=...) en cada modulo

  flyway:
    enabled: true
    schemas: identidad,matching,aula,reservas,pagos,resumen,reputacion,seguridad,admin
    locations: classpath:db/migration

  quartz:
    job-store-type: jdbc # persistido en Postgres, no en memoria (Articulo IV/X)
    scheduler-name: TinkuScheduler # fijo: las filas QRTZ_* quedan scoped por este nombre de scheduler
    jdbc:
      initialize-schema: never # las tablas QRTZ_* se crean via Flyway, no auto
    properties:
      org:
        quartz:
          jobStore:
            isClustered: false # revisar si el equipo crece a mas de un desarrollador/instancia
            tablePrefix: QRTZ_ # tablas en schema `public` (ver V3__quartz_tables.sql y backend/README.md)
            # Obligatorio para PostgreSQL: el default (StdJDBCDelegate) lee
            # JOB_DATA via getBlob() esperando un large object (OID), pero las
            # tablas QRTZ_* de V3 usan BYTEA -> "Bad value for type long".
            # Sin esto, cualquier JobDetail persistido (ej. capVencimiento, M1-F)
            # falla al almacenarse/recuperarse.
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate

server:
  port: 8080

# Configuracion de integraciones externas - ver Registro de Decisiones Tecnicas
# de la Constitucion. Todas via variable de entorno, ninguna hardcodeada.
tinku:
  jwt:
    secret: ${JWT_SECRET:CAMBIAR_EN_TODOS_LOS_AMBIENTES_AL_AGREGAR_UN_SECRET_REAL}
    expiration-minutes: 60
  livekit:
    base-url: ${LIVEKIT_URL:} # ej. wss://xxx.livekit.cloud — REST de sala bajo /twirp
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
    # TTL del token de acceso. Parametro tecnico de integracion (no un plazo de
    # negocio de Tabla_Tiempos): duracion de validez del JWT para unirse a la sala.
    token-ttl-segundos: ${LIVEKIT_TOKEN_TTL_SEGUNDOS:3600}
  mercadopago:
    access-token: ${MP_ACCESS_TOKEN:}
    marketplace-fee-percent: 15 # BR-PAG-01
  ocr:
    # ADR-M1-01: Tesseract via Tess4J (in-process). tessdata apunta a la carpeta
    # que contiene spa.traineddata. Si vacío, Tess4J usa TESSDATA_PREFIX del entorno.
    tessdata: ${TESSDATA_PREFIX:}
    idioma: ${OCR_IDIOMA:spa}
    backoff-horas: ${OCR_BACKOFF_HORAS:24} # FR-ID-011: espera tras agotar 3 intentos de foto (Tabla_Tiempos)
  credencial:
    backoff-horas: ${CREDENCIAL_BACKOFF_HORAS:24} # FR-ID-012: 24hs * 2^n (24→48→96…) tras agotar ciclo de credencial (Tabla_Tiempos)
  matching-service:
    base-url: ${MATCHING_SERVICE_URL:http://localhost:8000}
