# Perfil de producción: SOLO placeholders de variables de entorno, sin defaults.
# Si falta una, el arranque falla al resolver el placeholder — nunca arranca con un
# valor de desarrollo. El resto de las integraciones ya viene del entorno en
# application.yml. ArranqueSeguroValidator rechaza además el OCR stub y el JWT
# secret placeholder.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

tinku:
  jwt:
    secret: ${JWT_SECRET}
  matching-service:
    # AUD-015: sin default — si falta, el arranque falla (nunca "abierto").
    token: ${MATCHING_SERVICE_TOKEN}
  app:
    # FASE2-03: los enlaces de los emails no pueden apuntar a localhost.
    url-publica: ${APP_URL_PUBLICA}
