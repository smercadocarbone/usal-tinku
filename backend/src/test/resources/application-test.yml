spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

tinku:
  jwt:
    secret: test-secret-nunca-usar-en-produccion
  livekit:
    # M3-B: el webhook de joins requiere claves configuradas (fail-closed si no).
    # api-secret >= 32 bytes (HS256, exige hmacShaKeyFor). Solo de prueba — jamás
    # usar en produccion.
    api-key: test-livekit-api-key
    api-secret: 0123456789012345678901234567890123456789
  mercadopago:
    # M5-B: el webhook de pagos requiere el secret de firma (fail-closed si no).
    # Solo de prueba — jamás usar en produccion.
    webhook-secret: test-mercadopago-webhook-secret
  reservas:
    # Stub del puerto TarifaProveedor (M5 no implementado). Valor en centavos/pesos
    # para poder ejercitar la creacion de Reservas en los tests de integracion.
    tarifa-stub: 15000
  admin:
    # Identidad de un Admin de Moderacion durante el desarrollo (M7/M9 usan
    # AdminModeracionGate; la tabla `admins` llega en M8). DNI de un unico
    # usuario de test — ver CalificacionesFlujosIntegracionTest.
    moderacion:
      ids: 39999999
