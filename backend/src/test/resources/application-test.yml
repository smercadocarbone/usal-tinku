spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

tinku:
  # FASE2-02: la suite hace cientos de registros/logins desde 127.0.0.1. Límites
  # altos para no depender del filtro; RateLimitYBloqueoLoginIntegracionTest los
  # prueba con valores bajos propios. NUNCA subir los de producción por esto.
  rate-limit:
    publicos-por-minuto: 100000
    verificar-dni-por-minuto: 100000
    webhooks-por-minuto: 100000
  login:
    intentos-antes-de-bloqueo: 100000
  jwt:
    secret: test-secret-nunca-usar-en-produccion
  livekit:
    # M3-B: el webhook de joins requiere claves configuradas (fail-closed si no).
    # api-secret >= 32 bytes (HS256, exige hmacShaKeyFor). Solo de prueba — jamás
    # usar en produccion.
    api-key: test-livekit-api-key
    api-secret: 0123456789012345678901234567890123456789
  mercadopago:
    # M5-B: el webhook de pagos requiere el secret de firma (fail-closed si no).
    # Solo de prueba — jamás usar en produccion.
    webhook-secret: test-mercadopago-webhook-secret
  reservas:
    # Fallback del puerto TarifaProveedor (M5-H) cuando el Tutor no configuró su
    # tarifa en pagos.tarifas_tutor. Valor en pesos para poder ejercitar la
    # creacion de Reservas en los tests de integracion.
    tarifa-stub: 15000
