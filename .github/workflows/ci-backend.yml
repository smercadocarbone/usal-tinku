name: CI - tinku-backend

# En `main` los tests los corre deploy.yml antes de publicar; acá, los PR.
on:
  pull_request:
    branches: [main]
    paths: ["backend/**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build y tests (Testcontainers levanta Postgres solo)
        run: mvn -B verify
