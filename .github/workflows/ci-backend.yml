name: CI - tinku-backend

# En `main` los tests los corre deploy.yml antes de publicar; acá, los PR.
on:
  pull_request:
    branches: [main]
    paths: ["backend/**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Los mismos paquetes que el Dockerfile: TesseractOcrServiceRealTest lee fotos de DNI con el
      # programa real (ADR-M1-08). Sin esto el test se saltea y un OCR roto no se ve (pasó).
      - name: Tesseract (OCR real)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa

      - name: Build y tests (Testcontainers levanta Postgres solo)
        run: mvn -B verify

      # ADR-000-05: la cobertura se mide y se publica; todavía no corta el build.
      - name: Cobertura de líneas en el resumen del job
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "### Cobertura de líneas del backend: %.1f %%\n", 100*c/(m+c)}' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reporte de cobertura (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-backend
          path: backend/target/site/jacoco
