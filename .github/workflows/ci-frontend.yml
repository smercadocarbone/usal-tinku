name: CI - tinku-frontend

on:
  push:
    branches: [main, develop]
    paths: ["frontend/**"]
  pull_request:
    branches: [main, develop]
    paths: ["frontend/**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Instalar Chromium para Playwright
        run: bunx playwright install --with-deps chromium

      # Los tests E2E mockean /api/** — no necesitan el backend Java levantado.
      # El servidor de desarrollo lo levanta el propio playwright.config.ts.
      - name: Tests E2E
        run: bun run test:e2e

      - name: Guardar reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
