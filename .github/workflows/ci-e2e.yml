name: Smoke E2E - stack real

# AUD-031: el camino crítico contra base + matching-service + backend reales, sin mocks
# (scripts/smoke-e2e.sh). Es lento (construye las imágenes y baja el modelo): corre de
# noche y a mano, no en cada PR.
on:
  schedule:
    - cron: "17 6 * * *"   # 03:17 en Argentina
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TINKU_MATCHING_TOKEN: smoke-token
      MATCHING_SERVICE_TOKEN: smoke-token
    steps:
      - uses: actions/checkout@v7
      - name: Levantar base, matching y backend
        run: docker compose up -d --build db matching backend
      - name: Smoke
        run: scripts/smoke-e2e.sh
      - name: Logs si falló
        if: failure()
        run: docker compose logs --no-color --tail=300 backend matching
