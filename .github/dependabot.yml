# AUD-032: avisos de dependencias con vulnerabilidades o desactualizadas. Semanal y
# agrupado para que sea revisable por una sola persona.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      spring: { patterns: ["org.springframework*"] }
      # api, impl y jackson de jjwt van juntos: mezclar versiones rompe el JWT en runtime.
      jjwt: { patterns: ["io.jsonwebtoken*"] }
    ignore:
      # Saltos mayores (Spring Boot 4) cambian demasiado para un PR automático: a mano.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /matching-service
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
    ignore:
      # La suite y el enforcer exigen JDK 21 (AGENTS §5): la imagen no cambia de Java sola.
      - dependency-name: "maven"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
