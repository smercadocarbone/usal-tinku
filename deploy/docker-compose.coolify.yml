# Tinku en producción — recurso "Docker Compose" de Coolify (ADR-000-07).
#
# - Las imágenes las construye y publica GitHub Actions en GHCR (.github/workflows/deploy.yml);
#   el VPS nunca compila. TINKU_TAG elige la versión (default `latest`); para volver atrás
#   se pone el hash del commit anterior y se redespliega (ver docs/operacion/RUNBOOK_produccion.md).
# - Entrada: Cloudflare Tunnel (servidor en casa, sin IP fija ni puertos abiertos en el router).
#   El contenedor `cloudflared` saca el tráfico hacia Cloudflare; en el panel de Cloudflare el túnel
#   manda tinku.site → http://frontend:3000 y api.tinku.site → http://backend:8080. HTTPS lo pone
#   Cloudflare: en Coolify NO se asignan dominios. Ningún servicio publica puertos (TD2).
# - Secretos: los SERVICE_PASSWORD_* los genera Coolify la primera vez y los guarda; el resto
#   se carga en la pestaña "Environment Variables" del recurso. Nunca en este archivo (TD3).
# - Memoria (8 GB, ~1 GB para Coolify): db 1 GB, matching 3 GB, backend 1,5 GB, frontend 512 MB,
#   backup y cloudflared 128 MB c/u. Total ~6,3 GB; queda margen para picos y para el sistema.

services:
  # Cloudflare Tunnel (ADR-000-07): única entrada desde internet.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?falta CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
      - backend
    mem_limit: 128m

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tinku
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - tinku-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d tinku"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g

  # Backup diario de Postgres, cifrado, a un bucket S3 compatible (Cloudflare R2) fuera del VPS
  # (ADR-000-07). Hay menores entre los usuarios (Ley 25.326): sin BACKUP_PASSPHRASE no se sube nada.
  # Las variables son opcionales para poder arrancar sin R2: mientras falten, el backup de cada
  # noche falla con error en el log de este contenedor y NO hay copia fuera del servidor.
  # Cargar las cinco juntas: con R2 configurado y sin BACKUP_PASSPHRASE, el dump subiría SIN cifrar.
  backup:
    image: eeshugerman/postgres-backup-s3:16
    restart: unless-stopped
    environment:
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "14"
      PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      S3_REGION: auto
      S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      S3_PREFIX: postgres
      S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      POSTGRES_HOST: db
      POSTGRES_DATABASE: tinku
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m

  matching:
    image: ghcr.io/smercadocarbone/tinku-matching:${TINKU_TAG:-latest}
    restart: unless-stopped
    environment:
      TINKU_PG_HOST: db
      TINKU_PG_PORT: "5432"
      TINKU_PG_DBNAME: tinku
      TINKU_PG_USER: ${SERVICE_USER_POSTGRES}
      TINKU_PG_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      # AUD-015: mismo valor que MATCHING_SERVICE_TOKEN del backend.
      TINKU_MATCHING_TOKEN: ${SERVICE_PASSWORD_64_MATCHING}
    volumes:
      - tinku-models:/models
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 3g

  backend:
    image: ghcr.io/smercadocarbone/tinku-backend:${TINKU_TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tinku
      DB_USER: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      MATCHING_SERVICE_URL: http://matching:8000
      MATCHING_SERVICE_TOKEN: ${SERVICE_PASSWORD_64_MATCHING}
      CORS_ALLOWED_ORIGINS: ${APP_URL_PUBLICA:-https://tinku.site}
      APP_URL_PUBLICA: ${APP_URL_PUBLICA:-https://tinku.site}
      # Email (ADR-000-06). Vacíos = sin email (avisos solo en la app).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_REMITENTE: ${EMAIL_REMITENTE:-}
      # LiveKit Cloud (M3).
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # MercadoPago (M5). Sin MP_WEBHOOK_SECRET el webhook rechaza todo (fail-closed).
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      # ADR-M5-02: app de marketplace (OAuth por Tutor). Sin MP_CLIENT_ID se cobra con el token
      # de la plataforma, sin reparto. TINKU_CLAVE_CIFRADO: `openssl rand -base64 32`.
      MP_CLIENT_ID: ${MP_CLIENT_ID:-}
      MP_CLIENT_SECRET: ${MP_CLIENT_SECRET:-}
      MP_OAUTH_REDIRECT_URI: ${MP_OAUTH_REDIRECT_URI:-}
      TINKU_CLAVE_CIFRADO: ${TINKU_CLAVE_CIFRADO:-}
      MP_NOTIFICATION_URL: https://api.tinku.site/api/webhooks/mercadopago
      # Resumen (M6). Vacío = fail-closed.
      LLM_PROVEEDOR: ${LLM_PROVEEDOR:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # T09: adicional pago de resumen. false hasta tener el texto legal de la cláusula (ADR-M3-04).
      TINKU_RESUMEN_ADICIONAL_HABILITADO: ${TINKU_RESUMEN_ADICIONAL_HABILITADO:-false}
      TINKU_RESUMEN_ADICIONAL_PRECIO_ARS: ${TINKU_RESUMEN_ADICIONAL_PRECIO_ARS:-770}
      TINKU_CLAUSULA_GRABACION_VERSION: ${TINKU_CLAUSULA_GRABACION_VERSION:-borrador-1}
      TARIFA_PISO_HORA_ARS: ${TARIFA_PISO_HORA_ARS:-6140}
      # Detrás del túnel todo llega desde cloudflared: la IP real del cliente viaja en este
      # header. Seguro solo porque el backend no es alcanzable por otro camino.
      RATE_LIMIT_HEADER_IP: CF-Connecting-IP
    volumes:
      - tinku-archivos:/data
    depends_on:
      db:
        condition: service_healthy
      matching:
        condition: service_started
    mem_limit: 1536m

  frontend:
    image: ghcr.io/smercadocarbone/tinku-frontend:${TINKU_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    mem_limit: 512m

volumes:
  tinku-pgdata:
  tinku-models:
  tinku-archivos:
